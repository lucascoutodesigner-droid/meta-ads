  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="s3-situacoes"]');
      function H(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
      var bp = scope.querySelector('#b-parts');
      for (var p = 0; p < 26; p++) { var q = document.createElement('div'); q.className = 'b-pt sphere ' + (p % 3 ? 'ice' : 'gold'); q.id = 'b-pt-' + p; bp.appendChild(q); }
      var stars = scope.querySelector('#c-stars');
      for (var s = 0; s < 22; s++) { var st = document.createElement('div'); st.className = 'star'; st.id = 'st-' + s; st.style.left = (H(s) * 1040 + 20) + 'px'; st.style.top = (H(s + 40) * 520 + 10) + 'px'; stars.appendChild(st); }
      var hz = scope.querySelector('#c-hz');
      [[690, 770], [800, 770], [690, 1010], [800, 1010]].forEach(function (c, i) { var h = document.createElement('div'); h.className = 'hz'; h.id = 'hz-' + i; h.style.left = c[0] + 'px'; h.style.top = c[1] + 'px'; hz.appendChild(h); });
      TZ.mount(scope);
      ['#a-title', '#b-title', '#c-title', '#c-close'].forEach(function (id) { scope.querySelectorAll(id + ' span').forEach(function (el) { TZ.words(el); }); });
      var W = function (sel) { return scope.querySelectorAll(sel + ' .word'); };
      var tl = gsap.timeline({ paused: true });
      var IN = function (sel, at, d) { tl.fromTo(W(sel), { y: 46, opacity: 0, rotationX: -55, transformPerspective: 800 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.5, ease: 'back.out(1.6)', stagger: 0.09 }, at); };
      var OUT = function (sel, at) { tl.to(sel, { y: -40, opacity: 0, duration: 0.3, ease: 'power3.in' }, at); };
      var cnt = function (n, at) {
        ['#n1', '#n2', '#n3'].forEach(function (id, i) { tl.to(id, { color: i + 1 === n ? '#F2C763' : 'rgba(255,255,255,0.5)', scale: i + 1 === n ? 1.18 : 1, duration: 0.25, ease: 'back.out(2)' }, at); });
      };
      // contador (pílula de vidro no topo da zona segura)
      tl.fromTo('#s3-count', { y: -30, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, 0.1);
      cnt(1, 0.1); cnt(2, 4.0); cnt(3, 8.0);
      // fundo
      tl.fromTo('#s3-glow', { scale: 0.9 }, { scale: 1.2, duration: 13, ease: 'sine.inOut' }, 0);
      tl.to('#s3-night', { opacity: 1, duration: 0.9, ease: 'power2.inOut' }, 7.8);
      tl.to('#s3-glow', { opacity: 0, duration: 0.8 }, 8.0);

      /* ---- 3a: 0–4 ---- */
      tl.fromTo('#s3-a', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
      tl.fromTo('#a-world', { rotationX: 56, scale: 0.94, x: -30 }, { rotationX: 52, scale: 1.08, x: 20, duration: 4, ease: 'sine.inOut' }, 0);
      tl.fromTo('#a-carA', { y: 180 }, { y: 0, duration: 1.45, ease: 'power2.inOut' }, 0.5);
      tl.fromTo('#a-carA', { x: 0 }, { x: 0, duration: 0.01 }, 0);
      // impacto
      tl.to('#a-carB', { y: -16, rotationZ: 3.5, duration: 0.18, ease: 'power3.out' }, 1.95);
      tl.to('#a-carB', { y: -6, rotationZ: 0, duration: 0.7, ease: 'elastic.out(1,0.45)' }, 2.13);
      tl.to('#a-carA', { y: -8, duration: 0.16, ease: 'power3.out', overwrite: 'auto' }, 1.95);
      tl.to('#a-carA', { y: 10, duration: 0.5, ease: 'power2.out' }, 2.11);
      tl.fromTo('#a-ring', { scale: 0.4, opacity: 0.95 }, { scale: 3.2, opacity: 0, duration: 0.7, ease: 'power2.out' }, 1.97);
      tl.fromTo('#a-dent', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, 2.0);
      IN('#a-title', 0.4);
      // orçamento desenrolando
      tl.to('#a-roll', { opacity: 1, duration: 0.2 }, 2.35);
      tl.fromTo('#a-paper', { clipPath: 'inset(0px 0px 100% 0px round 26px)' }, { clipPath: 'inset(0px 0px 0% 0px round 26px)', duration: 1.4, ease: 'power2.inOut' }, 2.4);
      tl.fromTo('#a-roll', { y: 0 }, { y: 560, duration: 1.4, ease: 'power2.inOut' }, 2.4);
      tl.to('#a-roll', { opacity: 0, duration: 0.25 }, 3.7);
      scope.querySelectorAll('#a-paper .row').forEach(function (r, i) {
        tl.fromTo(r, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, 2.55 + i * 0.14);
      });
      OUT('#a-title', 3.7); tl.to('#a-paper', { opacity: 0, y: -30, duration: 0.3, ease: 'power3.in' }, 3.7);
      tl.to('#s3-a', { opacity: 0, duration: 0.25 }, 3.85);

      /* ---- 3b: 4–8 ---- */
      tl.fromTo('#s3-b', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.8);
      tl.fromTo('#b-world', { rotationX: 58, scale: 0.94, y: 30 }, { rotationX: 54, scale: 1.1, y: 0, duration: 4.2, ease: 'sine.inOut' }, 3.8);
      tl.fromTo('#b-car', { z: 260, opacity: 0 }, { z: 0, opacity: 1, duration: 0.8, ease: 'bounce.out' }, 3.85);
      IN('#b-title', 4.05);
      tl.fromTo('#b-slot', { borderColor: 'rgba(223,239,245,0.85)' }, { borderColor: 'rgba(242,199,99,1)', duration: 0.4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 5.3);
      // o carro se desfaz em partículas
      var car = scope.querySelector('#b-car');
      tl.to(car.querySelector('.c-solid'), { opacity: 0, scale: 0.92, duration: 0.9, ease: 'power2.in' }, 5.6);
      tl.to(car.querySelector('.c-shadow'), { opacity: 0, duration: 0.6 }, 5.7);
      tl.to(car.querySelector('.c-line'), { opacity: 1, duration: 0.5 }, 5.9);
      for (var pi = 0; pi < 26; pi++) {
        var bx = (H(pi) - 0.5) * 110, by = (H(pi + 7) - 0.5) * 200 + 100;
        tl.fromTo('#b-pt-' + pi, { x: bx, y: by, z: 20, scale: 0.8 + H(pi + 2), opacity: 0 }, { opacity: 1, duration: 0.15 }, 5.6 + H(pi + 3) * 0.3);
        tl.to('#b-pt-' + pi, { x: bx + (H(pi + 11) - 0.5) * 260, y: by - 120 - H(pi + 13) * 240, z: 120 + H(pi + 17) * 260, opacity: 0, duration: 1.1, ease: 'power2.out' }, 5.75 + H(pi + 3) * 0.3);
      }
      tl.fromTo(car.querySelector('.c-line'), { borderColor: 'rgba(124,195,220,0.55)' }, { borderColor: 'rgba(242,199,99,0.95)', duration: 0.45, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 6.4);
      OUT('#b-title', 7.7);
      tl.to('#s3-b', { opacity: 0, duration: 0.3 }, 7.9);

      /* ---- 3c: 8–13 ---- */
      tl.fromTo('#s3-c', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.75);
      for (var si = 0; si < 22; si++) tl.fromTo('#st-' + si, { opacity: 0 }, { opacity: 0.35 + H(si + 5) * 0.55, duration: 0.8, ease: 'power1.out' }, 8.3 + H(si) * 0.8);
      tl.fromTo('#c-world', { rotationX: 70, scale: 0.96, x: 20 }, { rotationX: 66, scale: 1.08, x: -20, duration: 5, ease: 'sine.inOut' }, 8.0);
      tl.fromTo('#c-car', { x: 90, opacity: 0, rotationZ: 6 }, { x: 0, opacity: 1, rotationZ: 0, duration: 0.7, ease: 'back.out(1.4)' }, 7.95);
      IN('#c-title', 8.15);
      // pisca-alerta âmbar pulsando em sincronia
      for (var hi = 0; hi < 4; hi++) tl.fromTo('#hz-' + hi, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.5, duration: 0.3, ease: 'power2.out', yoyo: true, repeat: 9 }, 9.2);
      tl.fromTo('#c-wash', { opacity: 0 }, { opacity: 0.9, duration: 0.3, ease: 'power2.out', yoyo: true, repeat: 9 }, 9.2);
      IN('#c-close', 10.3);
      tl.fromTo('#c-k2', { scale: 1.0 }, { scale: 1.06, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 11.2);
      // feixe de luz dourada (o escudo chegando)
      tl.fromTo('#s3-beam', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.7, ease: 'power3.in' }, 12.2);
      tl.to('#s3-beam', { scaleX: 1.5, duration: 0.3, ease: 'power2.out' }, 12.7);

      window.__timelines = window.__timelines || {};
      window.__timelines['s3-situacoes'] = tl;
    })();
  </script>
