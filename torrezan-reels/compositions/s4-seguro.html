  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="s4-seguro"]');
      TZ.mount(scope);
      ['l1', 'l2', 'l3'].forEach(function (id) { TZ.words(scope.querySelector('#' + id)); });
      var tl = gsap.timeline({ paused: true });

      // fundo e parallax
      tl.fromTo('#s4-glow', { scale: 0.85, opacity: 0.3 }, { scale: 1.15, opacity: 1, duration: 16, ease: 'sine.inOut' }, 0);
      tl.fromTo('#s4-sph-a', { y: 40, x: -20 }, { y: -80, x: 30, duration: 16, ease: 'sine.inOut' }, 0);
      tl.fromTo('#s4-sph-b', { y: -20 }, { y: 100, x: -30, duration: 16, ease: 'sine.inOut' }, 0);
      tl.fromTo('#s4-sph-c', { y: 40 }, { y: -70, duration: 16, ease: 'sine.inOut' }, 0);
      tl.fromTo('#s4-sph-d', { y: -30 }, { y: 60, x: 40, duration: 16, ease: 'sine.inOut' }, 0);

      // feixe de luz e chegada do escudo (continuação da cena 3)
      tl.fromTo('#s4-beam', { opacity: 1, scaleX: 1.5 }, { opacity: 0, scaleX: 0.7, duration: 1.4, ease: 'power2.out' }, 0.2);
      tl.fromTo('#s4-shield', { y: -1100, z: -60, rotationY: -180, scale: 0.7, opacity: 1, transformPerspective: 1500 }, { y: 0, z: -60, rotationY: 0, scale: 1, duration: 1.7, ease: 'power3.out' }, 0);
      tl.fromTo('#s4-car', { z: 300, opacity: 0, scale: 0.8, rotationX: 16 }, { z: 0, opacity: 1, scale: 1, rotationX: 16, duration: 0.9, ease: 'bounce.out' }, 1.0);
      tl.fromTo('#s4-bubble', { scale: 0.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: 'back.out(1.4)' }, 1.5);
      // órbita da câmera em volta do carro
      tl.fromTo('#s4-stage', { rotationY: -18 }, { rotationY: 18, duration: 14.6, ease: 'sine.inOut' }, 0);
      // esferas em órbita (loop linear)
      var R = [[300, 90], [330, 120], [270, 70], [310, 100]];
      [1, 2, 3, 4].forEach(function (n, i) {
        var o = { a: i * 1.57 };
        tl.to(o, { a: o.a + 6.2832 * 2.4, duration: 16, ease: 'none', onUpdate: (function (el, ob, r) { return function () { gsap.set(el, { x: Math.cos(ob.a) * r[0], y: Math.sin(ob.a) * r[1] - 20, z: Math.sin(ob.a) * 140 }); }; })(scope.querySelector('#o' + n), o, R[i]) }, 0);
        tl.fromTo('#o' + n, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(2)' }, 2.0 + i * 0.2);
      });

      // abertura
      tl.fromTo(scope.querySelectorAll('#s4-lead .word'), { y: 50, opacity: 0, rotationX: -55, transformPerspective: 800 }, { y: 0, opacity: 1, rotationX: 0, duration: 0.55, ease: 'back.out(1.6)', stagger: 0.1 }, 0.9);
      tl.to('#s4-lead', { y: -50, opacity: 0, duration: 0.4, ease: 'power3.in' }, 3.2);
      // fase B: grupo sobe e encolhe; pílulas entram uma por vez
      tl.to('#s4-stage', { y: -300, scale: 0.72, duration: 0.9, ease: 'power3.inOut' }, 3.3);

      var pills = [['#p1', 3.8, -1], ['#p2', 6.2, 1], ['#p3', 8.6, -1], ['#p4', 11.0, 1]];
      pills.forEach(function (p) {
        tl.fromTo(p[0], { x: p[2] * 900, opacity: 0, rotationY: p[2] * 40, transformPerspective: 1000 }, { x: 0, opacity: 1, rotationY: 0, duration: 0.8, ease: 'back.out(1.5)' }, p[1]);
        tl.fromTo(p[0] + ' .ic', { scale: 0 }, { scale: 1, duration: 0.5, ease: 'back.out(2.4)' }, p[1] + 0.3);
        // o escudo acende a cada pílula
        tl.fromTo('#s4-flash', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.15, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 }, p[1] + 0.35);
        tl.fromTo('#s4-bubble', { scale: 1 }, { scale: 1.07, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 }, p[1] + 0.35);
      });
      tl.fromTo('#s4-foot', { y: 20, opacity: 0 }, { y: 0, opacity: 0.95, duration: 0.5, ease: 'power3.out' }, 4.4);

      // saída: pílulas recolhem para dentro do escudo, que vira selo no canto
      ['#p1', '#p2', '#p3', '#p4'].forEach(function (id, i) {
        tl.to(id, { x: 0, y: -(parseFloat(scope.querySelector(id).style.top) - 540), scale: 0.1, opacity: 0, duration: 0.7, ease: 'power3.in' }, 14.2 + i * 0.07);
      });
      tl.to('#s4-foot', { opacity: 0, duration: 0.3 }, 14.2);
      tl.to('#s4-bubble, #s4-car, #s4-orbit', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 14.4);
      tl.to('#s4-stage', { x: 390, y: -516, scale: 0.34, rotationY: 0, duration: 1.1, ease: 'power3.inOut' }, 14.7);
      window.__timelines = window.__timelines || {};
      window.__timelines['s4-seguro'] = tl;
    })();
  </script>
